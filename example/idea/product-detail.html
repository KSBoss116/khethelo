<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail - COSSO</title>
    <link rel="stylesheet" href="Untitled-1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">realsnapper</div>
        <nav>
            <ul>
                <li><a href="Untitled-1.html">Home</a></li>
                <li><a href="search.html">Search</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="Contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="icons">
            <a href="Account_settings.html"><i class="fa fa-user"></i></a>
            <i class="fa fa-shopping-cart"></i>
        </div>
    </header>

    <div class="product-detail">
        <div class="product-images">
            <img id="product-image" src="" alt="Product Image">
        </div>
        <div class="product-info">
            <h1 id="product-title"></h1>
            <p class="product-price" id="product-price"></p>
            <p class="product-description" id="product-description"></p>
            <div class="product-actions">
                <button class="add-to-cart">Add to Cart</button>
                <button class="buy-now-pdp">Buy Now</button>
            </div>
        </div>
    </div>

    <script>
        // Get product details from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        // Update product details
        document.getElementById('product-title').textContent = urlParams.get('name');
        document.getElementById('product-price').textContent = `$${urlParams.get('price')}`;
        document.getElementById('product-description').textContent = urlParams.get('description');
        document.getElementById('product-image').src = urlParams.get('image');
    </script>
</body>
</html>
